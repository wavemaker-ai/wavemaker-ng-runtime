<button class="btn-leading-icon" type="button" name="leadingIcon" *ngIf="leadingiconclass || leadingiconurl" (click)="iconClickEvent($event, 'leadingiconclick')">
       @if (leadingiconclass) {
        <i aria-hidden="true" [ngClass]="leadingiconclass"></i>
       } @else if (isLeadingSvgIcon) {
        <i role="img" class="app-icon app-icon-svg" aria-hidden="true" [iconUrl]="leadingiconurl"></i>
       } @else {
        <img data-identifier="img" alt="leading icon" class="app-icon input-image-icon" [src]="leadingiconurl | image"/>
       }
</button>
<input class="form-control app-textbox"
       focus-target
       [type]="type"
       [attr.name]="name"
       [attr.aria-label]="arialabel"
       [(ngModel)]="datavalue"
       [imask]="mask"
       [unmask]="true"
       [ngModelOptions]="ngModelOptions"
       [readonly]="readonly"
       [required]="required"
       [disabled]="disabled"
       [maxlength]="maxchars"
       [pattern]="regexp"
       [attr.tabindex]="tabindex"
       [attr.placeholder]="placeholder"
       [attr.accesskey]="shortcutkey"
       [autofocus]="autofocus"
       [ngClass]="computedClasses"
       [ngStyle]="conditionalstyle"
       (ngModelChange)="handleChange($event)"
       (blur)="handleBlur($event); checkForDisplayFormat($event)"
       (focus)="checkForDisplayFormat($event)"
       [autocomplete]="autocomplete ? 'on' : 'off'"
       (keyup.enter)="flushViewChanges(input.value)"
       #input>
<button class="btn-trailing-icon" type="button" name="trailingIcon" *ngIf="trailingiconclass || trailingiconurl" (click)="iconClickEvent($event, 'trailingiconclick')">
       @if (trailingiconclass) {
        <i aria-hidden="true" [ngClass]="trailingiconclass"></i>
       } @else if (isTrailingSvgIcon) {
        <i role="img" class="app-icon app-icon-svg" aria-hidden="true" [iconUrl]="trailingiconurl"></i>
       } @else {
        <img data-identifier="img" alt="trailing icon" class="app-icon input-image-icon" [src]="trailingiconurl | image"/>
       }
</button>
