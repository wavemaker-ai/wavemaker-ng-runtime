<div (focus)="onFocus($event)" [(ngModel)]="modelByKey" [ngModelOptions]="{standalone: true}"
  class="ratings-wrapper" ngDefaultControl>
  <div [class.hidden]="readonly && isDecimal" [class.disabled]="readonly" class="rating-style">
    @for (rate of ratingItems; track rate) {
      <label
        [ngClass]="{active : rate.index <= selectedRatingValue}"
        [ngStyle]="{'font-size' :iconsize, color: rate.index <= selectedRatingValue && iconcolor}"
        [title]="rate.label || rate.index"
        (touchstart)="onTouchStart($event)"
        (mouseleave)="onMouseleave($event, rate)"
        (mouseover)="onMouseOver($event, rate)"
        [for]="_id + '-' + rate.index">
        @if (rate.index <= selectedRatingValue ? isActiveSvgIcon : isInactiveSvgIcon) {
          <i class="app-icon app-icon-svg"
             role="img"
             aria-hidden="true"
             [iconUrl]="rate.index <= selectedRatingValue ? activeiconurl : inactiveiconurl"></i>
        } @else if (rate.index <= selectedRatingValue ? useActiveImageIcon : useInactiveImageIcon) {
          <img data-identifier="img"
               class="app-icon"
               alt="Rating"
               [src]="(rate.index <= selectedRatingValue ? activeiconurl : inactiveiconurl) | image"/>
        } @else {
          <i class="app-icon {{rate.index <= selectedRatingValue ? resolvedActiveIconClass : resolvedInactiveIconClass}}" aria-hidden="true"></i>
        }
        <input #ratingInput type="radio" role="radio" [attr.aria-label]="(rate.label || rate.index) + ' out of ' + ratingItems.length + ' ratings'" [attr.aria-checked]="rate.label === datavalue ? 'true' : 'false'"
          [id]="_id + '-' + rate.index" (click)="onRatingClick($event, rate)" name="ratings-id" [value]="rate.key || rate.index"/>
      </label>
    }
  </div>
    <div class="ratings-container readonly" [class.hidden]="!isDecimal" [ngStyle]="{ 'font-size': iconsize }">
        <div class="ratings-base">
            @if (isInactiveSvgIcon) {
              <i *ngFor="let s of starsArray"
                 class="app-icon app-icon-svg"
                 role="img"
                 aria-hidden="true"
                 [iconUrl]="inactiveiconurl"></i>
            } @else if (useInactiveImageIcon) {
              <img *ngFor="let s of starsArray"
                   data-identifier="img"
                   class="app-icon"
                   alt="Rating"
                   [src]="inactiveiconurl | image"/>
            } @else {
              <i class="app-icon {{resolvedInactiveIconClass}}" *ngFor="let s of starsArray"></i>
            }
        </div>
        <div class="ratings active" [ngStyle]="{ width: ratingsWidth, color: iconcolor }">
            @if (isActiveSvgIcon) {
              <i *ngFor="let s of starsArray"
                 class="app-icon app-icon-svg"
                 role="img"
                 aria-hidden="true"
                 [iconUrl]="activeiconurl"></i>
            } @else if (useActiveImageIcon) {
              <img *ngFor="let s of starsArray"
                   data-identifier="img"
                   class="app-icon"
                   alt="Rating"
                   [src]="activeiconurl | image"/>
            } @else {
              <i class="app-icon {{resolvedActiveIconClass}}" *ngFor="let s of starsArray"></i>
            }
        </div>
    </div>
    @if (showcaptions) {
    <label class="caption" [textContent]="caption"></label>
  }
</div>
