
@if (iconclass || iconurl) {
  <wm-app-icon [iconurl]="iconurl"
             iconClasses="button-image-icon"
             alt="button image"
             [iconStyle]="{width:iconwidth, height:iconheight, margin:iconmargin, fontSize:iconwidth}"></wm-app-icon>
  <span class="sr-only">{{caption}} {{appLocale.LABEL_ICON}}</span>
}
<span class="btn-caption" [innerHTML]="caption"></span>
<ng-content select=".caret"></ng-content>
@if (badgevalue) {
  <span class="badge pull-right" [textContent]="badgevalue"></span>
}
