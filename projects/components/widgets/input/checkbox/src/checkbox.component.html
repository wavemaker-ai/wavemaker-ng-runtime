<label [ngClass]="{'unchecked': !proxyModel, 'disabled': (disabled || readonly), 'required': (required && _caption), 'icon-button-toggle': type === 'button'}">
    <input type="checkbox"
           #checkbox
           [attr.name]="name"
           [attr.aria-label]="arialabel"
           focus-target
           [(ngModel)]="proxyModel"
           [ngModelOptions]="{standalone: true}"
           [readonly]="readonly"
           [required]="required"
           [disabled]="disabled || readonly"
           [attr.accesskey]="shortcutkey"
           [tabindex]="tabindex"
           (blur)="invokeOnTouched($event)"
           (ngModelChange)="handleChange($event)">
    <span class="caption" [innerHtml]="_caption" *ngIf="type != 'button' && type != 'toggle'"></span>
    <!-- Icon toggle button -->
    <span class="caption fa-xs text-center" *ngIf="type == 'toggle'">
        <wm-app-icon [iconclass]="unselectedicon" [iconurl]="unselectediconurl" [defaulticonclass]="'start-icon'" *ngIf="!proxyModel"></wm-app-icon> 
        <wm-app-icon [iconclass]="selectedicon" [iconurl]="selectediconurl" [defaulticonclass]="'end-icon'" *ngIf="proxyModel"></wm-app-icon> 
    </span>
    <wm-app-icon [iconclass]="unselectedicon" [iconurl]="unselectediconurl" [defaultIconClass]="'toggle-icon'" [alt]="'Unselected icon'" *ngIf="type === 'button' && !proxyModel"></wm-app-icon>
    <wm-app-icon [iconclass]="selectedicon" [iconurl]="selectediconurl" [defaultIconClass]="'toggle-icon'" [alt]="'Selected icon'" *ngIf="proxyModel && type === 'button'"></wm-app-icon>
    <img alt="Checkbox Image" aria-hidden="true" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="switch"/>
</label>
<input type="hidden" class="ng-hide model-holder" aria-hidden="true" tabindex="-1" [disabled]="disabled" [value]="proxyModel">
