<!--
  002-stepper-header-widget: the header is the standalone `wm-wizardstepper` widget. The page
  markup authors one explicitly (as a child, same as wm-wizardstep/wm-wizardaction), and it is
  projected here, selectable/movable on canvas like any other widget. See wizard.component.ts
  ngAfterContentInit for the wizContext handshake this component reads from.
-->
<ng-content select="div[wmWizardStepper]"></ng-content>
@if (type !== 'dynamic') {
<div class="app-wizard-body">
  @if (message.caption) {
    <p wmMessage caption.bind="message.caption" type.bind="message.type"></p>
  }
  <ng-content ngProjectAs="form[wmWizardStep]"></ng-content>
</div>
}
@if (type === 'dynamic') {
<div class="app-wizard-body">
    @if(!fieldDefs?.length) {
    <div>{{nodatamessage}}</div>
    }
    <ng-content select="div[wmRepeatTemplate]"></ng-content>
</div>
}
@if(fieldDefs && fieldDefs.length || type !== 'dynamic') {
    <ng-container *ngTemplateOutlet="wizardAction"></ng-container>
}
