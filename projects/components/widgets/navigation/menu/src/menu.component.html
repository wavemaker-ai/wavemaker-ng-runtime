

<ng-template #innerTemplate>
  @if (useSvgIcon) {
    <i class="app-icon app-icon-svg"
       role="img"
       aria-hidden="true"
       [iconUrl]="iconurl"></i>
  } @else if (useImageIcon) {
    <img data-identifier="img"
         class="app-icon"
         alt="Menu icon"
         [src]="iconurl | image"/>
  } @else {
    <i class="app-icon {{iconclass}}"></i>
  }
  <span class="caption" [textContent]="caption"></span>
  <span class="pull-right caret fa {{menuCaret}}"></span>
</ng-template>

@if (type === 'anchor') {
  <a wmAnchor
    dropdownToggle
    [attr.aria-label]="arialabel || 'Menu'"
    href="javascript:void(0);"
    role="button"
    aria-haspopup="true"
    aria-expanded="false"
    hint.bind="hint"
    class="dropdown-toggle {{menuclass}}"
    shortcutkey.bind="shortcutkey"
    tabindex.bind="tabindex"
    caption.bind="caption"
    iconclass.bind="iconclass"
    iconurl.bind="iconurl"
    iconposition.bind="iconposition"
    badgevalue.bind="badgevalue"
    >
    <span class="pull-right caret fa" [ngClass]="[menuCaret]"></span>
  </a>
} @else {
  <button wmButton
    dropdownToggle
    aria-haspopup="true"
    aria-expanded="false"
    [attr.aria-label]="arialabel || 'Menu'"
    class="btn app-button dropdown-toggle {{menuclass}}"
    hint.bind="hint"
    shortcutkey.bind="shortcutkey"
    tabindex.bind="tabindex"
    caption.bind="caption"
    iconclass.bind="iconclass"
    iconurl.bind="iconurl"
    iconposition.bind="iconposition"
    type="button">
    <span class="pull-right caret fa" [ngClass]="[menuCaret]"></span>
  </button>
}

<ul *dropdownMenu [items]="nodes" [ngClass]="menulayout" class="icon-position-{{iconposition}}" role="menubar"
wmMenuDropdown></ul>
