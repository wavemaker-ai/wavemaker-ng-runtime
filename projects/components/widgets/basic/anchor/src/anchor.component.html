
<wm-app-icon [iconclass]="iconclass" [iconurl]="iconurl" [defaultClasses]="iconurl ? 'anchor-image-icon' : ''" [iconStyle]="{width: iconwidth, height: iconheight, margin: iconmargin, fontSize: iconwidth}" alt="Anchor icon"></wm-app-icon>
@if (iconclass || iconurl) {
  <span class="sr-only">{{caption}} {{appLocale.LABEL_ICON}}</span>
}
<span class="anchor-caption" [innerHTML]="caption"></span>
<ng-content select=".caret"></ng-content>
@if (badgevalue) {
  <span class="badge pull-right" [textContent]="badgevalue"></span>
}
