@if (useSvgIcon) {
  <i class="app-icon app-icon-svg"
     role="img"
     [attr.aria-label]="arialabel || caption || appLocale.LABEL_ICON"
     [iconUrl]="iconurl"></i>
} @else if (useImageIcon) {
  <img data-identifier="img"
       class="app-icon app-icon-img"
       [src]="iconurl | image"
       [alt]="arialabel || caption || appLocale.LABEL_ICON"/>
} @else {
  <i class="app-icon {{resolvedIconClass}}"></i>
}
@if (resolvedIconClass || useSvgIcon || useImageIcon) {
  <span class="sr-only">{{ arialabel || caption || appLocale.LABEL_ICON }}</span>
}
@if (caption) {
  <label [textContent]="caption" aria-hidden="true" class="app-label"></label>
}
